{% extends "main/base.html" %}
{% block content %}
{% load static %}

{% block head %}
<link rel="stylesheet" href="{% static 'css/styles-admin.css' %}">
{% endblock %}

<div class="admin-panel">
    <nav class="admin-nav">
        <a href="{% url 'admin_product_list' %}" class="nav-link">Товары</a>
        <a href="{% url 'admin_product_create' %}" class="nav-link">Добавить товар</a>
    </nav>
    <main class="admin-main">
        <h1>Удалить товар</h1>
        <p>Вы уверены, что хотите удалить товар "{{ product.title }}"?</p>
        <form method="post" class="admin-form">
            {% csrf_token %}
            <div class="form-actions">
                <button type="submit" class="btn btn-delete">Удалить</button>
                <a href="{% url 'admin_product_list' %}" class="btn btn-cancel">Отмена</a>
            </div>
        </form>
    </main>
</div>
{% endblock %}
