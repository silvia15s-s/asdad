<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REGISTRATION | NXT Sports</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@100;300;400;500;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Oswald', sans-serif;
        }
        
        body {
            background-color: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            text-transform: uppercase;
        }
        
        /* Верхняя черная полоса */
        .top-bar {
            background: #000;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            z-index: 10;
            position: relative;
        }
        
        .top-bar-content {
            display: flex;
            justify-content: space-between;
            width: 100%;
            align-items: center;
        }
        
        .promo-text {
            color: #fff;
            font-weight: 300;
            font-size: 18px;
            letter-spacing: 2px;
        }
        
        .promo-text strong {
            font-weight: 700;
            color: #e30613;
        }
        
        .top-auth-buttons {
            display: flex;
            gap: 15px;
        }
        
        .top-auth-btn {
            background: transparent;
            color: #fff;
            border: 1px solid #fff;
            padding: 8px 20px;
            font-size: 14px;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            font-weight: 300;
        }
        
        .top-auth-btn:hover {
            background: #fff;
            color: #000;
        }
        
        /* Основной контент */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 50px 20px;
        }
        
        .auth-container {
            width: 100%;
            max-width: 500px;
            padding: 40px;
            border: 1px solid #333;
            background: rgba(0, 0, 0, 0.7);
            text-align: center;
            animation: fadeIn 0.5s ease-out;
        }
        
        .auth-title {
            font-size: 32px;
            margin-bottom: 30px;
            font-weight: 300;
            letter-spacing: 3px;
            color: #e30613;
        }
        
        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
            text-align: left;
        }
        
        .form-group label {
            margin-bottom: 8px;
            font-weight: 300;
            letter-spacing: 1px;
            font-size: 16px;
        }
        
        .form-group input {
            background: transparent;
            border: 1px solid #333;
            padding: 12px 15px;
            color: #fff;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #e30613;
        }
        
        .auth-submit {
            background: #e30613;
            color: #fff;
            border: none;
            padding: 12px;
            font-size: 16px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            font-weight: 300;
            margin-top: 10px;
        }
        
        .auth-submit:hover {
            background: #c00511;
        }
        
        .auth-switch {
            margin-top: 20px;
            font-weight: 300;
            font-size: 14px;
        }
        
        .auth-switch a {
            color: #e30613;
            text-decoration: none;
            transition: all 0.3s;
        }
        
        .auth-switch a:hover {
            text-decoration: underline;
        }
        
        /* Футер */
        footer {
            background: #000;
            padding: 30px;
            border-top: 1px solid #333;
            margin-top: auto;
        }
        
        .footer-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .footer-links ul {
            display: flex;
            list-style: none;
            gap: 30px;
        }
        
        .footer-links a {
            color: #fff;
            text-decoration: none;
            font-size: 16px;
            letter-spacing: 1px;
            transition: all 0.3s;
            font-weight: 300;
        }
        
        .footer-links a:hover {
            color: #e30613;
        }
        
        .social-icons {
            display: flex;
            gap: 20px;
        }
        
        .social-icons a {
            color: #fff;
            font-size: 22px;
            transition: all 0.3s;
        }
        
        .social-icons a:hover {
            color: #e30613;
            transform: translateY(-3px);
        }
        
        .copyright {
            text-align: center;
            margin-top: 40px;
            font-size: 14px;
            opacity: 0.6;
            font-weight: 300;
        }
        
        /* Анимации */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <!-- Верхняя черная полоса -->
    <div class="top-bar">
        <div class="top-bar-content">
            <div class="promo-text">HIGH QUALITY <strong>PERFORMANCE | NXT SPORTS JAPAN</strong></div>
            <div class="top-auth-buttons">
                <button class="top-auth-btn" onclick="window.location.href='login.html'">SIGN IN</button>
            </div>
        </div>
    </div>
    
    <!-- Основной контент -->
    <div class="main-content">
        <div class="auth-container">
            <h1 class="auth-title">REGISTRATION</h1>
            <form class="auth-form" id="registerForm">
                <div class="form-group">
                    <label for="username">USERNAME</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="email">EMAIL</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">PASSWORD</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="form-group">
                    <label for="confirm-password">CONFIRM PASSWORD</label>
                    <input type="password" id="confirm-password" name="confirm-password" required>
                </div>
                <button type="submit" class="auth-submit">REGISTER</button>
            </form>
            <div class="auth-switch">
                ALREADY HAVE AN ACCOUNT? <a href="login.html">SIGN IN</a>
            </div>
        </div>
    </div>
            
    <!-- Футер -->
    <footer>
        <div class="footer-content">
            <div class="footer-links">
                <ul>
                    <li><a href="index.html">HOME</a></li>
                    <li><a href="#">ABOUT</a></li>
                    <li><a href="#">TEAM</a></li>
                    <li><a href="#">SERVICE</a></li>
                    <li><a href="#">CONTACT</a></li>
                </ul>
            </div>
            
            <div class="social-icons">
                <a href="#"><i class="fab fa-instagram"></i></a>
                <a href="#"><i class="fab fa-facebook-f"></i></a>
                <a href="#"><i class="fab fa-twitter"></i></a>
                <a href="#"><i class="fab fa-youtube"></i></a>
            </div>
        </div>
        
        <div class="copyright">
            © 2025 NXT SPORTS JAPAN. ALL RIGHTS RESERVED.
        </div>
    </footer>
    
    <script>
        // Обработка формы регистрации
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            
            if (password !== confirmPassword) {
                alert('Passwords do not match!');
                return;
            }
            
            // Здесь должна быть логика регистрации
            alert('Registration successful! Redirecting to login...');
            window.location.href = 'login.html';
        });
        
        // Обновление времени
        function updateTime() {
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const timeString = `${hours}:${minutes}`;
        }
        
        updateTime();
        setInterval(updateTime, 60000);
    </script>
</body>
</html>
