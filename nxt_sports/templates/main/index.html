<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NXT Sports</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@100;300;400;500;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Oswald', sans-serif;
        }
        
        body {
            background-color: #000;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            text-transform: uppercase;
            overflow: hidden;
        }
        
        /* Верхняя черная полоса */
        .top-bar {
            background: #000;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            z-index: 10;
            position: relative;
        }
        

        .top-bar-content {
            display: flex;
            justify-content: space-between;
            width: 100%;
            align-items: center;
        }
        
        .promo-text {
            color: #fff;
            font-weight: 300;
            font-size: 18px;
            letter-spacing: 2px;
        }
        
        .promo-text strong {
            font-weight: 700;
            color: #e30613;
        }
        
        .top-auth-buttons {
            display: flex;
            gap: 15px;
        }
        
        .top-auth-btn {
            background: transparent;
            color: #fff;
            border: 1px solid #fff;
            padding: 8px 20px;
            font-size: 14px;
            letter-spacing: 1px;
            cursor: button;
            transition: all 0.3s;
            text-transform: uppercase;
            font-weight: 300;
        }
        
        .top-auth-btn:hover {
            background: #fff;
            color: #000;
        }
        
        /* Основной контент */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        .video-background {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -1;
            opacity: 0.4;
        }
        
        .content-overlay {
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 2;
            text-align: center;
        }
        
        .logo {
            font-size: 120px;
            font-weight: 100;
            letter-spacing: 10px;
            margin-bottom: 40px;
            position: relative;
            animation: fadeIn 1.5s ease-out;
        }
        
        .logo::after {
            content: "";
            display: block;
            width: 400px;
            height: 1px;
            background: #e30613;
            margin: 15px auto;
            animation: expandLine 1s ease-out 0.5s forwards;
            transform: scaleX(0);
            transform-origin: center;
        }
        
        nav {
            margin-bottom: 80px;
            position: relative;
        }
        
        nav ul {
            display: flex;
            list-style: none;
            gap: 60px;
            justify-content: center;
        }
        
        nav ul li {
            position: relative;
        }
        
        nav ul li a {
            color: #fff;
            text-decoration: none;
            font-size: 24px;
            letter-spacing: 3px;
            position: relative;
            font-weight: 300;
            transition: all 0.3s;
            display: block;
            padding: 10px 0;
        }
        
        nav ul li a:hover {
            color: #e30613;
        }
        
        /* Выпадающее меню для SERVICE */
        .dropdown-menu {
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #333;
            padding: 15px 0;
            min-width: 200px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        
        .dropdown-menu li {
            padding: 10px 30px;
            text-align: center;
        }
        
        nav ul li:hover .dropdown-menu {
            opacity: 1;
            visibility: visible;
            animation: fadeInUp 0.3s ease-out;
        }
        
        .social-icons {
            display: flex;
            gap: 25px;
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            animation: fadeIn 2s ease-out;
        }
        
        .social-icons a {
            color: #fff;
            font-size: 28px;
            transition: all 0.3s;
        }
        
        .social-icons a:hover {
            color: #e30613;
            transform: translateY(-3px);
        }
        
        .time-bottom {
            position: absolute;
            bottom: 40px;
            right: 40px;
            font-size: 14px;
            letter-spacing: 3px;
            opacity: 0.7;
            font-weight: 300;
            animation: fadeIn 2s ease-out;
        }
        
        /* Анимации */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Контактная секция */
        .contact-section {
            padding: 100px 0;
            text-align: center;
            background: #000;
            border-top: 1px solid #333;
            width: 100%;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translate(-50%, 10px);
            }
            to {
                opacity: 1;
                transform: translate(-50%, 0);
            }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translate(-50%, 10px);
            }
            to {
                opacity: 1;
                transform: translate(-50%, 0);
            }
        }
        
        @keyframes expandLine {
            from { transform: scaleX(0); }
            to { transform: scaleX(1); }
        }
        
        @keyframes expandLine {
            from { transform: scaleX(0); }
            to { transform: scaleX(1); }
        }
    </style>
</head>
<body>
    <!-- Верхняя черная полоса -->
        <div class="top-bar-content">
            <div class="promo-text">HIGH QUALITY <strong>PERFORMANCE | NXT SPORTS JAPAN</strong></div>
            
            <div class="top-auth-buttons">
                <div class="top-auth-buttons">
                    <a href="{% url 'registration' %}" class="top-auth-btn">REGISTER</a>
                    <a href="{% url 'login' %}" class="top-auth-btn">SIGN IN</a>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Основной контент -->
    <div class="main-content">
        <!-- Видео фон -->
        <video autoplay muted loop class="video-background">
            <source src="{% static 'media/qwe.mp4' %}" type="video/mp4">
        </video>
        
        <div class="content-overlay">
            <h1 class="logo">NXT SPORTS</h1>
            
            <nav>
                <ul>
                    <li><a href="{% url 'index' %}">HOME</a></li>
                    <li><a href="{% url 'about' %}">ABOUT</a></li>
                    <li><a href="{% url 'catalog' %}">CATALOG</a></li>
                    <li><a href="{% url 'contact' %}">CONTACT</a></li>
                </ul>
            </nav>

        
        <div class="social-icons">
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-facebook-f"></i></a>
            <a href="#"><i class="fab fa-twitter"></i></a>
            <a href="#"><i class="fab fa-youtube"></i></a>
        </div>
        
        <div class="time-bottom" id="bottom-time"></div>
    </div>

    <script>
        // Обновление времени в реальном времени
        function updateTime() {
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const timeString = `${hours}:${minutes}`;
            
            document.getElementById('bottom-time').textContent = timeString;
        }
        
        // Обновляем время сразу и каждую минуту
        updateTime();
        setInterval(updateTime, 60000);
        
        // Обработчики для кнопок
        document.querySelectorAll('.top-auth-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const action = this.textContent.trim();
                alert(`${action} временно недоступна`);
            });
        });

        // Добавляем обработчик для пункта CONTACT в меню
        document.querySelectorAll('nav ul li a').forEach(link => {
            if(link.textContent.trim() === 'CONTACT') {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    document.getElementById('contact').scrollIntoView({
                        behavior: 'smooth'
                    });
                });
            }
        });
        
        // Автовоспроизведение видео
        document.addEventListener('DOMContentLoaded', function() {
            const video = document.querySelector('.video-background');
            video.play().catch(e => console.log("Autoplay prevented:", e));
        });
    </script>
</body>
</html>
