<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REGISTRATION | NXT Sports</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/styles-registration.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Верхняя черная полоса -->
    <div class="top-bar">
        <div class="top-bar-content">
            <div class="promo-text">HIGH QUALITY <strong>PERFORMANCE | NXT SPORTS JAPAN</strong></div>
            <div class="top-auth-buttons">
                <a href="{% url 'login' %}" class="top-auth-btn">SIGN IN</a>
            </div>
        </div>
    </div>
    
    <!-- Основной контент -->
    <div class="main-content">
        <div class="auth-container">
            <h1 class="auth-title">REGISTRATION</h1>
            <form method="post" class="auth-form" novalidate>
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="auth-submit">REGISTER</button>
            </form>
            <div class="auth-switch">
                ALREADY HAVE AN ACCOUNT? <a href="{% url 'login' %}">SIGN IN</a>
            </div>
        </div>
    </div>
            
    <!-- Футер -->
    <footer>
        <div class="footer-content">
            <div class="footer-links">
                <ul>
                </ul>
            </div>
            
            <div class="social-icons">
                <a href="#"><i class="fab fa-instagram"></i></a>
                <a href="#"><i class="fab fa-facebook-f"></i></a>
                <a href="#"><i class="fab fa-twitter"></i></a>
                <a href="#"><i class="fab fa-youtube"></i></a>
            </div>
        </div>
        
        <div class="copyright">
            © 2025 NXT SPORTS JAPAN. ALL RIGHTS RESERVED.
        </div>
    </footer>
</body>
</html>
